<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOR my bae WINTER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh;
  background:#0b1020;
  overflow:hidden;
  font-family:system-ui, sans-serif;
  color:white;
}
.title{
  font-size:clamp(2rem,8vw,4rem);
  font-weight:bold;
  text-align:center;
  position:fixed;
  top:12%;
  left:50%;
  transform:translateX(-50%);
  background: linear-gradient(90deg,#b8d8ff,#ffc8dd,#c3b1ff);
  -webkit-background-clip:text;
  color:transparent;
  z-index:5;
}
.msg-item{
  position:absolute;
  font-size:clamp(1.1rem,3vw,1.8rem);
  color:#e8efff;
  text-align:center;
  pointer-events:none;
  animation:fadePop 1.2s ease forwards;
}
.particle{
  position:fixed;
  pointer-events:none;
  font-size:24px;
}
.click-particle{
  animation:fallBurst 3s linear forwards;
}
.snow-bg{
  animation:fallSlow 8s linear forwards;
}
@keyframes fadePop{
  0% {opacity:0; transform:scale(0.6)}
  100% {opacity:1; transform:scale(1)}
}
@keyframes fallBurst{
  from{opacity:1;transform:translateY(0) scale(1)}
  to{opacity:0;transform:translateY(100vh) scale(0.3)}
}
@keyframes fallSlow{
  from{opacity:0.6;transform:translateY(-30px)}
  to{opacity:0;transform:translateY(100vh)}
}
</style>
</head>
<body>
  <div class="title">FOR my bae WINTER</div>

<audio id="bgMusic" loop>
  <source src="./bgm.wav" type="audio/wav">


<script>
const texts = [
  "In 2026, I met you when you were 24.",
  "That year, I was 21.",
  "Three numbers that seemed unrelated",
  "turned into our most special memories.",
  "I never thought I would love you this much.",
  "Back then, I could never imagine",
  "I would call you my wife, instead of teacher.",
  "I am quiet, and I do not like parties.",
  "You love life, quick and bright in your mind.",
  "We are two such different people.",
  "It is from you that I understand what “lovely” means.",
  "It is November, 2026.",
  "Right now I am in the UK.",
  "Clumsy as I am, this is how I show my love.",
  "If you read this, please remember:",
  "I love you. I miss you.",
  "I want to hold you tight in my arms.",
  "I wish you good health.",
  "I wish you sleep well every night.",
  "I wish you fewer worries."
];
let currentIndex = 0;
const bgMusic = document.getElementById("bgMusic");
let musicStarted = false;

// 背景持续飘雪
function spawnBgSnow(){
  const p = document.createElement("div");
  p.className = "particle snow-bg";
  p.innerText = "❄";
  p.style.left = Math.random()*100 + "%";
  p.style.top = "-30px";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),8000);
}
setInterval(spawnBgSnow,600);

document.addEventListener("click", (e)=>{
  if(!musicStarted){
    bgMusic.play();
    musicStarted = true;
  }
  // 还有句子才继续弹出
  if(currentIndex < texts.length){
    const newText = document.createElement("div");
    newText.className = "msg-item";
    newText.innerText = texts[currentIndex];
    // 随机横向位置，纵向控制在中间区域，不会太靠边
    newText.style.left = 10 + Math.random()*80 + "%";
    newText.style.top = 25 + Math.random()*50 + "%";
    document.body.appendChild(newText);
    currentIndex++;
  }

  // 点击放出雪花爱心
  for(let i=0;i<12;i++){
    const emoji = i%2 ===0 ? "❤" : "❄";
    createClickParticle(e.clientX, e.clientY, emoji);
  }
})

function createClickParticle(x,y,emoji){
  const p = document.createElement("div");
  p.className = "particle click-particle";
  p.innerText = emoji;
  p.style.left = x + "px";
  p.style.top = y + "px";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),3000);
}
</script>
</body>
</html>

  #hint {
    position: absolute;
    bottom: 8%;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.15em;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }

  .particle {
    position: absolute;
    pointer-events: none;
    font-size: 1.3rem;
    animation: floatUp 2.5s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-280px) scale(1.6) rotate(180deg); }
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="title">
  FOR my bae
  <span class="small">WINTER ❄️</span>
</div>
<div id="quote"></div>
<div id="hint">tap anywhere</div>

<script>
  const quotes = [
    "I lift myself to wherever I want to go",
    "My courage is always greater than hardship",
    "You are incredibly beautiful",
    "Thank you for being you",
    "You inspire me to become a better person",
    "Every step counts",
    "The best is yet to come",
    "Stay positive",
    "Progress, not perfection",
    "Tomorrow is another chance",
    "Rise above the storm",
    "Your time is coming",
    "My favorite season is WINTER"
  ];

  const quoteEl = document.getElementById('quote');

  // background stars
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    document.body.appendChild(s);
  }

  document.addEventListener('click', (e) => {
    // random quote
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    quoteEl.textContent = q;
    quoteEl.classList.remove('show');
    void quoteEl.offsetWidth;
    quoteEl.classList.add('show');

    // hearts + snowflakes
    const cx = e.clientX;
    const cy = e.clientY;
    const emojis = ['💗', '💖', '❄️', '✨', '💫'];

    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = (cx + (Math.random() - 0.5) * 120) + 'px';
      p.style.top = (cy + (Math.random() - 0.5) * 60) + 'px';
      p.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3000);
    }
  });
</script>

</body>
</html>
