<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOR my bae WINTER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>❄️</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at bottom, #1a2a4a 0%, #0a0f24 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    position: relative;
    cursor: pointer;
  }

  .title {
    font-size: clamp(2.2rem, 9vw, 4.5rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    text-align: center;
    margin-bottom: 2rem;
    background: linear-gradient(135deg, #ffd6e8 0%, #a8d8ff 50%, #e0c3fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }

  .title .small {
    display: block;
    font-size: 0.45em;
    font-weight: 400;
    letter-spacing: 0.3em;
    margin-top: 0.5rem;
    opacity: 0.8;
  }

  #quote {
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    font-weight: 500;
    text-align: center;
    max-width: 85%;
    min-height: 4rem;
    line-height: 1.6;
    margin-bottom: 2.5rem;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    color: #e0f0ff;
    transform: translateY(10px);
  }
  #quote.show {
    opacity: 1;
    transform: translateY(0);
  }

  #hint {
    position: absolute;
    bottom: 8%;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.15em;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }

  .particle {
    position: absolute;
    pointer-events: none;
    font-size: 1.3rem;
    animation: floatUp 2.5s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-280px) scale(1.6) rotate(180deg); }
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="title">
  FOR my bae
  <span class="small">WINTER ❄️</span>
</div>
<div id="quote"></div>
<div id="hint">tap anywhere</div>

<script>
  const quotes = [
    "I lift myself to wherever I want to go",
    "My courage is always greater than hardship",
    "You are incredibly beautiful",
    "Thank you for being you",
    "You inspire me to become a better person",
    "Every step counts",
    "The best is yet to come",
    "Stay positive",
    "Progress, not perfection",
    "Tomorrow is another chance",
    "Rise above the storm",
    "Your time is coming",
    "My favorite season is WINTER"
  ];

  const quoteEl = document.getElementById('quote');

  // background stars
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    document.body.appendChild(s);
  }

  document.addEventListener('click', (e) => {
    // random quote
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    quoteEl.textContent = q;
    quoteEl.classList.remove('show');
    void quoteEl.offsetWidth;
    quoteEl.classList.add('show');

    // hearts + snowflakes
    const cx = e.clientX;
    const cy = e.clientY;
    const emojis = ['💗', '💖', '❄️', '✨', '💫'];

    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = (cx + (Math.random() - 0.5) * 120) + 'px';
      p.style.top = (cy + (Math.random() - 0.5) * 60) + 'px';
      p.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3000);
    }
  });
</script>

</body>
</html>
