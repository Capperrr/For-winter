<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOR my bae WINTER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh;
  background:#0b1020;
  overflow:hidden;
  font-family:system-ui, sans-serif;
  color:white;
}
.title{
  font-size:clamp(2rem,8vw,4rem);
  font-weight:bold;
  text-align:center;
  position:fixed;
  top:12%;
  left:50%;
  transform:translateX(-50%);
  background: linear-gradient(90deg,#b8d8ff,#ffc8dd,#c3b1ff);
  -webkit-background-clip:text;
  color:transparent;
  z-index:5;
  animation: breathe 3.5s ease-in-out infinite;
}
.tip-start{
  position:fixed;
  top:26%;
  left:50%;
  transform:translateX(-50%);
  opacity:0.75;
  font-size:1.1rem;
  pointer-events:none;
}
@keyframes breathe {
  0%,100% { filter: brightness(1) }
  50% { filter: brightness(1.3) }
}
.msg-item{
  position:absolute;
  font-size:clamp(1.1rem,3vw,1.8rem);
  color:#e8efff;
  text-align:center;
  pointer-events:none;
  white-space: pre-line;
}
.end-egg{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(1.8rem,6vw,3rem);
  color:#ffd6e8;
  text-align:center;
  z-index:20;
  text-shadow: 0 0 20px #ffb8d888;
  animation: fadePop 1.5s ease forwards;
  pointer-events: none;
}
.particle{
  position:fixed;
  pointer-events:none;
  font-size:24px;
}
.snow-bg{
  animation:fallSlow 8s linear forwards;
}
.mouse-heart{
  animation:floatAway 2.2s ease forwards;
  opacity:0.55;
}
@keyframes fadePop{
  0% {opacity:0; transform:scale(0.6)}
  100% {opacity:1; transform:scale(1)}
}
@keyframes fallSlow{
  from{opacity:0.6;transform:translateY(-30px)}
  to{opacity:0;transform:translateY(100vh)}
}
@keyframes floatAway{
  0% {opacity:0.55; transform:translateY(0) scale(1)}
  100% {opacity:0; transform:translateY(-70px) scale(0.4)}
}
</style>
</head>
<body>
  <div class="title">FOR my bae WINTER</div>
  <div class="tip-start">Tap anywhere to start ❄️</div>

<audio id="bgMusic" loop>
  <source src="./bgm.mp3.mp3" type="audio/mpeg">


<script>
const texts = [
  "In 2026, I met you when you were 24.",
  "That year, I was 21.",
  "Three numbers that seemed unrelated",
  "turned into our most special memories.",
  "I never thought I would love you this much.",
  "Back then, I could never imagine",
  "I would call you my wife, instead of teacher.",
  "I am quiet, and I do not like parties.",
  "You love life, quick and bright in your mind.",
  "We are two such different people.",
  "It is from you that I understand what “lovely” means.",
  "It is November, 2026.",
  "Right now I am in the UK.",
  "Clumsy as I am, this is how I show my love.",
  "If you read this, please remember:",
  "I love you. I miss you.",
  "I want to hold you tight in my arms.",
  "I wish you good health.",
  "I wish you sleep well every night.",
  "I wish you fewer worries."
];

function randomPos(){
  return {
    x: 10 + Math.random() * 80,
    y: 22 + Math.random() * 55
  }
}
async function typeWriter(el, text, speed = 45) {
  el.textContent = "";
  for(let i = 0; i < text.length; i++){
    el.textContent += text[i];
    await sleep(speed);
  }
}
function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function runTyping(){
  for(const sentence of texts){
    const pos = randomPos();
    const div = document.createElement("div");
    div.className = "msg-item";
    div.style.left = pos.x + "%";
    div.style.top = pos.y + "%";
    document.body.appendChild(div);
    await typeWriter(div, sentence);
    await sleep(6000);
  }
  const endDiv = document.createElement("div");
  endDiv.className = "end-egg";
  endDiv.innerText = "I will always be with you\n💍";
  document.body.appendChild(endDiv);
}

const audio = document.getElementById("bgMusic");
let started = false;
document.addEventListener("pointerdown", async ()=>{
  if(started) return;
  started = true;
  document.querySelector(".tip-start").remove();
  try{
    await audio.play();
  }catch(e){
    console.log("audio error",e);
  }
  runTyping();
})

// 雪花
function spawnBgSnow(){
  const p = document.createElement("div");
  p.className = "particle snow-bg";
  p.innerText = "❄";
  const size = 12 + Math.random()*18;
  p.style.fontSize = size + "px";
  p.style.left = Math.random()*100 + "%";
  p.style.top = "-30px";
  const dur = 5 + Math.random()*6;
  p.style.animationDuration = dur + "s";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(), dur*1000);
}
setInterval(spawnBgSnow,600);

// 鼠标飘爱心
document.addEventListener("mousemove", (e)=>{
  if(Math.random()>0.82){
    const h = document.createElement("div");
    h.className = "particle mouse-heart";
    h.innerText = "❤";
    h.style.left = e.clientX + "px";
    h.style.top = e.clientY + "px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),2200);
  }
})
</script>
</body>
</html>
